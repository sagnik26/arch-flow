spring.application.name=archigen

# Claude AI
claude.api-key=${CLAUDE_API_KEY}
claude.max-tokens=8192

# Disable JPA (since you're not using database yet)
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Logging - Show FULL errors
logging.level.com.archflow.archigen=DEBUG
logging.level.org.springframework.web.reactive=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Show full exception stack traces
server.error.include-stacktrace=always
server.error.include-message=always

# Web Scraping Configuration
scraping.request-timeout-seconds=30
scraping.max-concurrent-requests=5
scraping.delay-between-requests-ms=1000
scraping.max-content-length=50000
scraping.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
scraping.respect-robots-txt=true
scraping.max-requests-per-second=5.0
